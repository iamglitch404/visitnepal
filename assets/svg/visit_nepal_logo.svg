<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" fill="none">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#2563EB" />
      <stop offset="50%" stop-color="#1D4ED8" />
      <stop offset="100%" stop-color="#1E3A8A" />
    </linearGradient>

    <!-- Sun Glow Gradient -->
    <linearGradient id="sunGrad" x1="256" y1="120" x2="256" y2="280" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FCD34D" />
      <stop offset="100%" stop-color="#F59E0B" />
    </linearGradient>

    <!-- Peak Highlights -->
    <linearGradient id="leftPeakLit" x1="160" y1="180" x2="256" y2="380" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#E2E8F0" />
    </linearGradient>
    <linearGradient id="leftPeakShadow" x1="256" y1="180" x2="330" y2="380" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#CBD5E1" />
      <stop offset="100%" stop-color="#94A3B8" />
    </linearGradient>

    <linearGradient id="mainPeakLit" x1="220" y1="140" x2="290" y2="400" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#F1F5F9" />
    </linearGradient>
    <linearGradient id="mainPeakShadow" x1="290" y1="140" x2="380" y2="400" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#CBD5E1" />
      <stop offset="100%" stop-color="#64748B" />
    </linearGradient>
  </defs>

  <!-- Squircle Rounded Badge Background -->
  <rect x="32" y="32" width="448" height="448" rx="112" ry="112" fill="url(#bgGrad)" />
  <rect x="32" y="32" width="448" height="448" rx="112" ry="112" stroke="white" stroke-opacity="0.18" stroke-width="4" />

  <!-- Rising Dawn Sun -->
  <circle cx="256" cy="204" r="76" fill="url(#sunGrad)" opacity="0.95" />
  <circle cx="256" cy="204" r="88" stroke="#FDE68A" stroke-width="2" stroke-dasharray="4 6" opacity="0.5" />

  <!-- Left Mountain Peak (Annapurna / Machapuchare) -->
  <!-- Lit Face -->
  <polygon points="120,380 200,224 200,380" fill="url(#leftPeakLit)" opacity="0.95" />
  <!-- Shadow Face -->
  <polygon points="200,224 200,380 280,380" fill="url(#leftPeakShadow)" opacity="0.9" />
  <!-- Left Snow Cap -->
  <polygon points="200,224 175,272 195,268 200,278 210,266 225,272" fill="#FFFFFF" />

  <!-- Center Main Majestic Peak (Mount Everest) -->
  <!-- Lit Face -->
  <polygon points="170,400 284,148 284,400" fill="url(#mainPeakLit)" />
  <!-- Shadow Face -->
  <polygon points="284,148 284,400 410,400" fill="url(#mainPeakShadow)" />
  <!-- Center Main Snow Cap -->
  <polygon points="284,148 248,220 274,212 284,228 300,210 326,220" fill="#FFFFFF" />

  <!-- Right Foothills Ridge -->
  <polygon points="310,400 370,270 420,400" fill="#3B82F6" opacity="0.75" />
  <polygon points="370,270 420,400 440,400" fill="#1D4ED8" opacity="0.8" />

  <!-- Summit Star / Compass Flare -->
  <path d="M284,124 L288,140 L304,144 L288,148 L284,164 L280,148 L264,144 L280,140 Z" fill="#FDE047" />

  <!-- Clean Base Ribbon Accent -->
  <path d="M128,416 Q256,432 384,416" stroke="white" stroke-width="4" stroke-linecap="round" stroke-opacity="0.4" />
</svg>
