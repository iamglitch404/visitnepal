<!DOCTYPE html>
<html>
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Visit Nepal - Himalayan Travel & Expedition Platform">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Visit Nepal">
  <link rel="apple-touch-icon" href="assets/svg/logo.jpeg">

  <!-- Favicon -->
  <link rel="icon" type="image/jpeg" href="assets/svg/logo.jpeg"/>

  <title>Visit Nepal</title>
  <link rel="manifest" href="manifest.json">

  <style>
    body {
      background-color: #000000;
      margin: 0;
      padding: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
    .loading-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }
    .logo-img {
      width: 72px;
      height: 72px;
      border-radius: 18px;
      box-shadow: 0 8px 24px rgba(5, 82, 162, 0.4);
      object-fit: cover;
    }
    .loading-spinner {
      margin-top: 16px;
      width: 22px;
      height: 22px;
      border: 2.5px solid rgba(255, 255, 255, 0.2);
      border-top-color: #0552A2;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div id="loading" class="loading-container">
    <img src="assets/svg/logo.jpeg" alt="Visit Nepal Logo" class="logo-img">
    <div class="loading-spinner"></div>
  </div>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
